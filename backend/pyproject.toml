[project]
name = "story-scraper"
version = "0.2.0"
description = "Scrape web serials, convert them to ebooks and send them to Kindle"
authors = [{ name = "Jono Nicholas" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "cryptography>=42.0",
]

[project.scripts]
story-scraper = "story_scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_scraper", "src/app"]

[tool.hatch.build.targets.wheel.force-include]
"src/story_scraper/assets" = "story_scraper/assets"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
