name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      prev_tag: ${{ steps.diff.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compares against the previous release tag so an image is only
      # rebuilt when its own directory actually changed - the worker image
      # in particular is expensive to rebuild, so this keeps unrelated
      # (eg. frontend-only) releases from touching it.
      - id: diff
        run: |
          prev_tag=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags \
            | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$prev_tag" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$prev_tag" "$GITHUB_SHA")
          echo "$changed" | grep -q '^backend/' && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^frontend/' && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
            target: api
          - name: worker
            context: ./backend
            target: worker
          - name: frontend
            context: ./frontend
            target: ""
    steps:
      - uses: actions/checkout@v4

      - id: gate
        run: |
          if [ "${{ matrix.name }}" = "frontend" ]; then
            echo "changed=${{ needs.changes.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=${{ needs.changes.outputs.backend }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.gate.outputs.changed == 'true'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        if: steps.gate.outputs.changed == 'true'
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.changed == 'true'
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Nothing relevant changed for this image - point the new release tag
      # (and `latest`) at the previous build instead of rebuilding it.
      - name: Retag previous image
        if: steps.gate.outputs.changed == 'false'
        run: |
          image="ghcr.io/${{ github.repository }}-${{ matrix.name }}"
          src="$image:${{ needs.changes.outputs.prev_tag }}"

          docker buildx imagetools create --tag "$image:${{ github.ref_name }}" "$src"
          docker buildx imagetools create --tag "$image:sha-${GITHUB_SHA:0:7}" "$src"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker buildx imagetools create --tag "$image:latest" "$src"
          fi
